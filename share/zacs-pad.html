<style>
  :root{
    --bg:#0B0F14; --panel:#111823; --panel-2:#0E141D; --line:#202935;
    --fg:#E8EDF3; --dim:#8A99A8; --faint:#5B6875;
    --sig:#FFB23D; --sig-soft:rgba(255,178,61,.14); --net:#49A9FF; --online:#39C46B;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F5F7FA; --panel:#FFFFFF; --panel-2:#EEF2F7; --line:#DCE3EA;
      --fg:#0E1620; --dim:#54626F; --faint:#8695A2;
      --sig:#C9790F; --sig-soft:rgba(201,121,15,.12); --net:#1F7FD6; --online:#1F9D55;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F14; --panel:#111823; --panel-2:#0E141D; --line:#202935;
    --fg:#E8EDF3; --dim:#8A99A8; --faint:#5B6875;
    --sig:#FFB23D; --sig-soft:rgba(255,178,61,.14); --net:#49A9FF; --online:#39C46B;
  }
  :root[data-theme="light"]{
    --bg:#F5F7FA; --panel:#FFFFFF; --panel-2:#EEF2F7; --line:#DCE3EA;
    --fg:#0E1620; --dim:#54626F; --faint:#8695A2;
    --sig:#C9790F; --sig-soft:rgba(201,121,15,.12); --net:#1F7FD6; --online:#1F9D55;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5;
    background-image:radial-gradient(120% 60% at 50% -10%, color-mix(in srgb,var(--sig) 8%,transparent), transparent 60%);}
  .wrap{max-width:460px;margin:0 auto;padding:clamp(1.5rem,6vw,2.75rem) 1.15rem 2.5rem;}

  /* draft ribbon — remove once links are live */
  .draft{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sig);border:1px dashed color-mix(in srgb,var(--sig) 55%,transparent);
    background:var(--sig-soft);border-radius:999px;padding:.3rem .7rem;display:inline-block;margin:0 auto 1.4rem;}

  /* hero */
  .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.55rem;}
  .badge{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:.3rem;}
  .badge .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--sig);opacity:0;
    animation:sweep 3.4s ease-out infinite;}
  .badge .ring:nth-child(2){animation-delay:1.13s}
  .badge .ring:nth-child(3){animation-delay:2.26s}
  @keyframes sweep{0%{transform:scale(.35);opacity:.55}70%{opacity:.12}100%{transform:scale(1.15);opacity:0}}
  .badge .core{width:60px;height:60px;border-radius:16px;background:
      linear-gradient(150deg,color-mix(in srgb,var(--sig) 26%,var(--panel)),var(--panel));
    border:1px solid color-mix(in srgb,var(--sig) 40%,var(--line));
    display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.5rem;
    color:var(--sig);box-shadow:0 0 24px -6px color-mix(in srgb,var(--sig) 50%,transparent);}
  @media (prefers-reduced-motion: reduce){ .badge .ring{animation:none;opacity:.14} }


  .mark{width:132px;height:auto;display:block;margin:0 auto .35rem;filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--sig) 22%,transparent));}
  h1{font-family:var(--mono);font-weight:700;font-size:1.7rem;letter-spacing:-.01em;margin:0;}
  h1 .dot{color:var(--sig)}
  .tag{color:var(--dim);font-size:.95rem;max-width:32ch;margin:.1rem auto 0;text-wrap:balance;}
  .status{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.72rem;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:.5rem;}
  .status .led{width:8px;height:8px;border-radius:50%;background:var(--online);
    box-shadow:0 0 8px var(--online);}

  /* link stack */
  .group{margin-top:1.9rem;display:flex;flex-direction:column;gap:.6rem;}
  .glabel{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:.6rem .25rem .1rem;}
  a.btn{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:var(--fg);
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:.9rem 1rem;transition:border-color .15s,transform .06s,background .15s;}
  a.btn:hover{border-color:color-mix(in srgb,var(--net) 60%,var(--line));background:var(--panel-2);}
  a.btn:active{transform:translateY(1px)}
  a.btn:focus-visible{outline:2px solid var(--net);outline-offset:2px}
  .btn .ic{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;
    background:var(--sig-soft);border:1px solid color-mix(in srgb,var(--sig) 26%,transparent);}
  .btn .txt{flex:1;min-width:0}
  .btn .lb{display:block;font-weight:600;font-size:.98rem;line-height:1.2}
  .btn .sb{display:block;color:var(--dim);font-size:.8rem;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn .chev{color:var(--faint);font-family:var(--mono)}
  a.btn.primary{background:linear-gradient(150deg,color-mix(in srgb,var(--sig) 18%,var(--panel)),var(--panel));
    border-color:color-mix(in srgb,var(--sig) 45%,var(--line));}
  a.btn.primary .ic{background:var(--sig);border-color:var(--sig);color:#1a1206}
  a.btn.primary .chev{color:var(--sig)}

  /* placeholder (draft) buttons */
  a.btn.soon{cursor:not-allowed;opacity:.6}
  a.btn.soon:hover{border-color:var(--line);background:var(--panel)}
  .pill{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:.15rem .45rem;}

  footer{margin-top:2.2rem;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--faint);
    display:flex;flex-direction:column;gap:.3rem;}
  footer .hd{color:var(--dim)}
</style>

    <p class="tag">Homelab, hardware &amp; security — GhostGrid. One tap to everything.</p>
    <span class="status"><span class="led"></span>on the grid</span>

  <main id="board"></main>

  <footer>
    <span class="hd">GhostGrid · @stackzac22</span>
    <span>scan-friendly · no trackers</span>
  </footer>
</div>

<script>
  // ── Edit this list to update the page. Set href to a real URL to activate a button. ──
  // Buttons with href:"" render as "soon" placeholders (non-clickable) until you fill them.
  const PAD_URL = "https://claude.ai/code/artifact/0356aace-3329-46a4-a0f9-78e59d774448";

  const GROUPS = [
    { label: "", items: [
      { ic:"📤", lb:"Share this page", sb:"Send my pad to someone", action:"share", primary:true },
    ]},
    { label: "Work with me", items: [
      { ic:"🛡️", lb:"What I do — Services", sb:"The full GhostGrid menu", href:"https://claude.ai/code/artifact/2e48c7c1-02dc-4e18-8c13-0957ae887a2a", primary:true },
      { ic:"✉️", lb:"Contact",              sb:"Email · Signal",         href:"" },
    ]},
    { label: "The work", items: [
      { ic:"🌐", lb:"Website",                 sb:"stackzac22.github.io",   href:"https://stackzac22.github.io/" },
      { ic:"📓", lb:"GhostGrid — field notes", sb:"Homelab notes & logs",   href:"https://claude.ai/code/artifact/abd2f0e5-e59e-445e-9737-50075bb9f743" },
      { ic:"🛠️", lb:"Build Log 04",           sb:"Cloud vs local AI",      href:"https://claude.ai/code/artifact/f8e08838-7a9f-4a46-a709-e63cf717525b" },
    ]},
    { label: "Find me", items: [
      { ic:"🐙", lb:"GitHub",  sb:"Code & firmware", href:"https://github.com/stackzac22" },
      { ic:"▶️", lb:"YouTube", sb:"Shorts & demos",  href:"" },
      { ic:"𝕏",  lb:"X",       sb:"@stackzac22",     href:"https://x.com/stackzac22" },
    ]},
  ];

  function showToast(msg){
    let t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);"+
        "background:#14100a;color:#FFE7B4;font:600 13px/1.4 ui-monospace,monospace;"+
        "padding:10px 16px;border-radius:10px;border:1px solid #FFC24D;"+
        "box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .2s;z-index:99;";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(()=>{ t.style.opacity = "1"; });
    clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.opacity = "0"; }, 1900);
  }
  function copyFallback(){
    if (navigator.clipboard){
      navigator.clipboard.writeText(PAD_URL)
        .then(()=>showToast("Link copied — paste it to anyone"))
        .catch(()=>window.prompt("Copy my pad link:", PAD_URL));
    } else { window.prompt("Copy my pad link:", PAD_URL); }
  }
  function sharePad(){
    const data = { title:"Zac's Pad — GhostGrid",
      text:"Homelab, hardware & security — GhostGrid. One tap to everything.", url:PAD_URL };
    if (navigator.share){
      navigator.share(data).catch(err=>{ if(err && err.name==="AbortError") return; copyFallback(); });
      return;
    }
    copyFallback();
  }

  const board = document.getElementById("board");
  let anyLive = false;
  for (const g of GROUPS){
    if (g.label){ const gl=document.createElement("div"); gl.className="glabel"; gl.textContent=g.label; board.appendChild(gl); }
    const grp = document.createElement("div"); grp.className = "group";
    for (const it of g.items){
      const isShare = it.action === "share";
      const live = !!it.href || isShare;
      anyLive = anyLive || !!it.href;
      const a = document.createElement("a");
      a.className = "btn" + (it.primary ? " primary":"") + (live ? "" : " soon");
      a.href = it.href || "#";
      if (isShare){ a.addEventListener("click",e=>{ e.preventDefault(); sharePad(); }); }
      else if (it.href){ a.target="_blank"; a.rel="noopener noreferrer"; }
      else { a.setAttribute("aria-disabled","true"); a.addEventListener("click",e=>e.preventDefault()); }
      a.innerHTML =
        '<span class="ic">'+it.ic+'</span>'+
        '<span class="txt"><span class="lb">'+it.lb+'</span><span class="sb">'+it.sb+'</span></span>'+
        (isShare ? '<span class="chev">↗</span>'
                 : (it.href ? '<span class="chev">→</span>' : '<span class="pill">soon</span>'));
      grp.appendChild(a);
    }
    board.appendChild(grp);
  }
  if (anyLive){ const d=document.getElementById("draft"); if(d) d.remove(); }
</script>
